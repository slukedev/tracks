# Copy to secrets.properties (gitignored) and fill in to enable Last.fm.
# Create an API account at https://www.last.fm/api/account/create
lastfm.apiKey=your-api-key
lastfm.secret=your-shared-secret

# The Play upload key for release builds. Without it, release builds are signed with the
# debug key and the build says so. CI can set TRACKS_UPLOAD_STORE_FILE,
# TRACKS_UPLOAD_STORE_PASSWORD, TRACKS_UPLOAD_KEY_ALIAS and TRACKS_UPLOAD_KEY_PASSWORD instead.
# The keystore path is relative to Android/. Keep the keystore out of git (*.jks is ignored).
#upload.storeFile=upload.jks
#upload.storePassword=
#upload.keyAlias=upload
#upload.keyPassword=
