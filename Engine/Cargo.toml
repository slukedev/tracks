[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["patches/sysinfo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
tracks-model = { path = "crates/tracks-model" }
tracks-store = { path = "crates/tracks-store" }
tracks-lastfm = { path = "crates/tracks-lastfm" }
tracks-library = { path = "crates/tracks-library" }
tracks-mixes = { path = "crates/tracks-mixes" }
tracks-demo = { path = "crates/tracks-demo" }
tracks-catalog = { path = "crates/tracks-catalog" }
tracks-spotify = { path = "crates/tracks-spotify" }

rusqlite = { version = "0.43", features = ["bundled", "functions"] }
rusqlite_migration = "2.9"
thiserror = "2"
rustc-hash = "2.1"
unicode-normalization = "0.1"
jiff = "1"
md-5 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
uniffi = "0.32"

# Spotify (tracks-spotify, behind tracks-ffi's `spotify` feature). rustls with bundled roots keeps
# OpenSSL and the platform TLS libraries out; no audio backends, since the hosts render.
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-audio = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-protocol = "0.8"
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
symphonia = { version = "0.5", default-features = false }
tokio = { version = "1.54", features = ["rt-multi-thread", "time", "sync", "net", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1.5"
http-body-util = "0.1"
bytes = "1.12"
url = "2.5"
form_urlencoded = "1.2"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"

# Dev
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12"
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
single_match_else = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
unwrap_used = "deny"

# sysinfo 0.36 (librespot-core's) does not build for iOS; see patches/sysinfo.
[patch.crates-io]
sysinfo = { path = "patches/sysinfo" }

[profile.release]
# Small, fast binary for phones: one codegen unit and thin LTO keep the dylib lean
# without the minutes-long link of fat LTO.
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "unwind"
debug = "line-tables-only"
strip = "debuginfo"

[profile.bench]
inherits = "release"
debug = true
strip = "none"
