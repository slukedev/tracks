[package]
name = "tracks-ffi"
description = "The engine's surface for Swift (and later Kotlin), generated with UniFFI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "tracks_engine"

[features]
# Spotify on librespot. Off by default: it adds a TLS stack and Tokio, and depends on a
# reverse-engineered protocol Spotify does not permit.
spotify = ["dep:tracks-spotify"]

[dependencies]
tracks-model.workspace = true
tracks-store.workspace = true
tracks-lastfm.workspace = true
tracks-library.workspace = true
tracks-mixes.workspace = true
tracks-demo.workspace = true
tracks-catalog.workspace = true
tracks-spotify = { workspace = true, optional = true }
jiff.workspace = true
rustc-hash.workspace = true
uniffi.workspace = true
thiserror.workspace = true

[lints]
workspace = true
